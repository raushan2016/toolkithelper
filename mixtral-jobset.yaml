apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: "${JOB_PREFIX}"
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: "${KUEUE_NAME}"
spec:
  suspend: true
  failurePolicy:
    maxRestarts: 3
  replicatedJobs:
  - name: workload
    replicas: 1
    template:
      spec:
        parallelism: ${NUM_NODES}
        completions: ${NUM_NODES}
        backoffLimit: 0
        completionMode: Indexed
        ttlSecondsAfterFinished: 43200
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/default-container: workload
              gke-gcsfuse/volumes: "true"
              gke-gcsfuse/cpu-limit: "0"
              gke-gcsfuse/memory-limit: "0"
              gke-gcsfuse/ephemeral-storage-limit: "0"
              kueue.x-k8s.io/podset-preferred-topology: kubernetes.io/hostname
              networking.gke.io/default-interface: "eth0"
              networking.gke.io/interfaces: |
                [
                  {"interfaceName":"eth0","network":"default"},
                  {"interfaceName":"eth1","network":"gvnic-1"},
                  {"interfaceName":"eth2","network":"rdma-0"},
                  {"interfaceName":"eth3","network":"rdma-1"},
                  {"interfaceName":"eth4","network":"rdma-2"},
                  {"interfaceName":"eth5","network":"rdma-3"},
                  {"interfaceName":"eth6","network":"rdma-4"},
                  {"interfaceName":"eth7","network":"rdma-5"},
                  {"interfaceName":"eth8","network":"rdma-6"},
                  {"interfaceName":"eth9","network":"rdma-7"}
                ]
          spec:
            restartPolicy: Never
            terminationGracePeriodSeconds: 30
            
            tolerations:
            - operator: "Exists"
              key: nvidia.com/gpu
            - operator: "Exists"
              key: cloud.google.com/impending-node-termination

            volumes:
            

            - name: workload-configuration
              configMap:
                name: "${JOB_PREFIX}-config"
                items:
                - key: workload-configuration
                  path: nemo-config.yaml

            - name: workload-launcher
              configMap:
                name: "${JOB_PREFIX}-launcher"

            - name: shared-memory
              emptyDir:
                medium: "Memory"
                sizeLimit: 500Gi
            - name: "gcs-checkpoints"
              persistentVolumeClaim:
                claimName: pvc-checkpoint-${JOB_PREFIX}
            - name: "gcs-training-data"
              persistentVolumeClaim:
                claimName: pvc-training-${JOB_PREFIX}
            - name: "cloud-samples-data"
              csi:
                driver: gcsfuse.csi.storage.gke.io
                volumeAttributes:
                  bucketName: "cloud-samples-data"
                  mountOptions: "implicit-dirs"

            initContainers:
            
            

            containers:

            - name: workload
              image: "us-central1-docker.pkg.dev/deeplearning-images/reproducibility/pytorch-gpu-nemo-nccl:nemo25.04-gib1.0.6-A3U"
              imagePullPolicy: Always
              env:
              - name: JOB_IDENTIFIER
                value: "${JOB_PREFIX}"
              - name: JOB_TIMESTAMP
                value: "${JOB_TIMESTAMP}"
              - name: JOB_UUID
                value: "${JOB_UUID}"
              - name: JOB_ORCHESTRATOR
                value: "gke"
              # Add RANK based on the pod's index provided by the Indexed Job
              # This is crucial for torch.distributed initialization.
              - name: JOB_COMPLETION_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
              - name: REPLICATED_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/replicatedjob-name']
              - name: JOBSET_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['jobset.sigs.k8s.io/jobset-name']
              - name: MASTER_ADDR
                value: "${JOB_PREFIX}-workload-0-0.${JOB_PREFIX}"
              - name: MASTER_PORT
                value: "6002"
              - name: WORLD_SIZE
                value: "${NUM_GPUS}"
              - name: NNODES
                value: "${NUM_NODES}"
              - name: GPUS_PER_NODE
                value: "8"

              - name: NCCL_PLUGIN_PATH
                value: /usr/local/gib/lib64

              

              
              - name: NCCL_DEBUG
                value: VERSION
              

              
              - name: NEMO_CONFIG_PATH
                value: /workload/configs
              - name: NEMO_CONFIG_NAME
                value: nemo-config.yaml
              - name: EXPERIMENT_NAME
                value: nemo-experiments
              - name: EXPERIMENT_ROOT_DIR
                value: /workspace/experiments
              - name: CHECKPOINTS_ROOT_DIR
                value: /checkpoints
              - name: NVTE_FWD_LAYERNORM_SM_MARGIN
                value: "8"
              - name: NVTE_BWD_LAYERNORM_SM_MARGIN
                value: "8"
              - name: GLOO_SOCKET_IFNAME
                value: eth0
              - name: TOKENIZER_PATH
                value: /artifacts/third-party/tokenizers/gpt2
              - name: NEMO_LAUNCH_SCRIPT
                value: /opt/NeMo/examples/nlp/language_modeling/megatron_gpt_pretraining.py
              

              command:
              - bash
              - -c
              - |
                echo "Pod on $(hostname --fqdn) is running"
                echo "Pod is assigned job index of $JOB_COMPLETION_INDEX"

                if [[ -n "${NCCL_INIT_SCRIPT}" ]]; then
                  echo "Running NCCL init script: ${NCCL_INIT_SCRIPT}"
                  source ${NCCL_INIT_SCRIPT}
                fi

                echo "Launching workload with the following arguments:"
                echo ""

                sleep 10

                bash /workload/launcher/launch-workload.sh \


              volumeMounts:
                

                - name: workload-configuration
                  mountPath: /workload/configs

                - name: workload-launcher
                  mountPath: /workload/launcher

                - name: shared-memory
                  mountPath: /dev/shm
                - name: "gcs-checkpoints"
                  mountPath: "/checkpoints"
                - name: "gcs-training-data"
                  mountPath: "/training-data"
                - name: "cloud-samples-data"
                  mountPath: "/artifacts"

              resources:
                limits:
                  nvidia.com/gpu: 8
