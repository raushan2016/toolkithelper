apiVersion: v1
kind: Service
metadata:
  name: deepep-headless
  namespace: ${NAMESPACE}
  labels:
    app: deepep
spec:
  ports:
  - port: 29500
    name: torch-dist
  clusterIP: None
  selector:
    app: deepep
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: deepep-benchmark
  namespace: ${NAMESPACE}
  labels:
    app: deepep
spec:
  serviceName: 'deepep-headless'
  podManagementPolicy: Parallel
  replicas: ${NODES}
  selector:
    matchLabels:
      app: deepep
  template:
    metadata:
      labels:
        app: deepep
    spec:
      shareProcessNamespace: true
      hostIPC: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - deepep
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: deepep
        image: ${IMAGE}
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        - |
          echo "=================================================="
          echo "Starting DeepEP Benchmark (Node: ${POD_NAME})"
          echo "=================================================="
          
          export RANK=${POD_NAME##*-} 
          export NCCL_NET_PLUGIN=none
          export NCCL_TUNER_PLUGIN=none
          
          # Run the inter-node benchmark.
          # NVSHMEM_DEBUG* are set in env to trace DMA-Buf registration (ibv_reg_dmabuf_mr).
          python /workspace/DeepEP/tests/test_internode.py
          
          echo "=================================================="
          echo "Benchmark Finished. Sleeping for log collection..."
          echo "=================================================="
          sleep infinity
        env:
        - name: MASTER_PORT
          value: "29500"
        - name: MASTER_ADDR
          value: "deepep-benchmark-0.deepep-headless.${NAMESPACE}.svc.cluster.local"
        - name: WORLD_SIZE
          value: "${NODES}"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Enable TRACE logging for NVSHMEM memory and transport to showcase DMA-BUF registration
        - name: NVSHMEM_DEBUG
          value: "TRACE"
        - name: NVSHMEM_DEBUG_SUBSYS
          value: "MEM,TRANSPORT"
        # We optionally force testing over standard networking if NVLink is not wanted
        # - name: NVSHMEM_DISABLE_P2P
        #   value: "1"
        resources:
          limits:
            nvidia.com/gpu: ${GPUS_PER_NODE}
        ports:
        - containerPort: 29500
          name: torch-dist
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        securityContext:
          runAsUser: 0 
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
