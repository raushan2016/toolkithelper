apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: ${NAMESPACE}
  labels:
    app: etcd
spec:
  ports:
  - port: 2379
    name: client
  selector:
    app: etcd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: etcd
  namespace: ${NAMESPACE}
  labels:
    app: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.17
        command:
        - /usr/local/bin/etcd
        - --listen-client-urls=http://0.0.0.0:2379
        - --advertise-client-urls=http://etcd.${NAMESPACE}.svc.cluster.local:2379
        ports:
        - containerPort: 2379
          name: client
---
apiVersion: v1
kind: Service
metadata:
  name: hybrid-ep-headless-${RUN_ID}
  namespace: ${NAMESPACE}
  labels:
    app: hybrid-ep
spec:
  ports:
  - port: 29500
    name: torch-dist
  clusterIP: None
  selector:
    app: hybrid-ep
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hybrid-ep-benchmark-${RUN_ID}
  namespace: ${NAMESPACE}
  labels:
    app: hybrid-ep
spec:
  serviceName: 'hybrid-ep-headless-${RUN_ID}'
  podManagementPolicy: Parallel
  replicas: ${NODES}
  selector:
    matchLabels:
      app: hybrid-ep
  template:
    metadata:
      labels:
        app: hybrid-ep
    spec:
      shareProcessNamespace: true
      hostIPC: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - hybrid-ep
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: hybrid-ep
        image: ${IMAGE}
        imagePullPolicy: Always
        command:
        - /bin/bash
        - -c
        - |
          echo "=================================================="
          echo "Starting Hybrid-EP Benchmark (Node: ${POD_NAME})"
          echo "=================================================="
          
          # NIXL Configuration
          export USE_NIXL=1
          export HYBRID_EP_MULTINODE=1
          export NIXL_ETCD_ENDPOINTS=http://etcd.${NAMESPACE}.svc.cluster.local:2379
          
          # Performance Tuning (Optional but recommended)
          export DEEPEP_NIXL_GDA_NUM_CHANNELS=1
          
          export NCCL_TUNER_PLUGIN=none
          export NCCL_NET_PLUGIN=none
          export UCX_NET_DEVICES=all
          
          export RANK=${POD_NAME##*-}
          export WORLD_SIZE=${NODES}
          
          # Run the benchmark
          # Assuming test_hybrid_ep.py exists or we need to use it.
          # The documentation mentioned tests/test_hybrid_ep.py
          
          cd /opt/DeepEP
          python tests/test_hybrid_ep.py
          
          echo "=================================================="
          echo "Benchmark Finished. Sleeping for log collection..."
          echo "=================================================="
          sleep infinity
        env:
        - name: LD_PRELOAD
          value: "/usr/lib/x86_64-linux-gnu/libnccl.so.2"
        - name: MASTER_PORT
          value: "29500"
        - name: MASTER_ADDR
          value: "hybrid-ep-benchmark-${RUN_ID}-0.hybrid-ep-headless-${RUN_ID}.${NAMESPACE}.svc.cluster.local"
        - name: WORLD_SIZE
          value: "${NODES}"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TEST_TYPE
          value: "${TEST_TYPE}"
        resources:
          limits:
            nvidia.com/gpu: ${GPUS_PER_NODE}
        ports:
        - containerPort: 29500
          name: torch-dist
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: dev
          mountPath: /dev
        - name: nvidia-install-dir
          mountPath: /usr/local/nvidia
        securityContext:
          runAsUser: 0
          privileged: true
          capabilities:
            add: ["IPC_LOCK"]
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 256Gi
      - name: dev
        hostPath:
          path: /dev
      - name: nvidia-install-dir
        hostPath:
          path: /home/kubernetes/bin/nvidia
